<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery | JavaScript Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <p class="eyebrow">JAVASCRIPT PRACTICE</p>
    <h1>Image Gallery</h1>
    <p class="intro">Hover over an image, or focus it with your keyboard, to preview it above.</p>
  </header>

  <main>
    <div id="image" class="preview" role="status" aria-live="polite">
      Hover over an image below to display here.
    </div>

    <section class="gallery" aria-label="Image previews">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=85"
           alt="Golden sunlight spilling over a misty green landscape"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=85"
           alt="Mountain peaks rising above a quiet valley"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=85"
           alt="A peaceful lake reflecting mountains and trees"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=85"
           alt="Sunlight filtering through a lush forest"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=85"
           alt="A scenic alpine lake surrounded by rugged mountains"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">

      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=85"
           alt="Tall rocky mountain peaks beneath a cloudy sky"
           tabindex="0" onmouseover="upDate(this)" onmouseleave="undo()"
           onfocus="upDate(this)" onblur="undo()">
    </section>
  </main>

  <footer>
    <p>Built with HTML, CSS, and JavaScript.</p>
  </footer>
</body>
</html>
